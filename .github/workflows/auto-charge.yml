name: Neptune Auto Charge

on:
  # 定时运行：北京时间 6:05 = UTC 22:05（前一天）
  schedule:
    - cron: '5 22 * * *'

  # 支持手动触发（用于测试）
  workflow_dispatch:

jobs:
  auto-charge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m unittest discover -v

      - name: Create .env file
        env:
          NEPTUNE_OPEN_ID: ${{ secrets.NEPTUNE_OPEN_ID }}
          NEPTUNE_AREA_ID: ${{ secrets.NEPTUNE_AREA_ID }}
          NEPTUNE_EMPLOYEE_ID: ${{ secrets.NEPTUNE_EMPLOYEE_ID }}
        run: |
          test -n "$NEPTUNE_OPEN_ID" || { echo "Missing GitHub Actions secret: NEPTUNE_OPEN_ID"; exit 1; }
          test -n "$NEPTUNE_AREA_ID" || { echo "Missing GitHub Actions secret: NEPTUNE_AREA_ID"; exit 1; }
          test -n "$NEPTUNE_EMPLOYEE_ID" || { echo "Missing GitHub Actions secret: NEPTUNE_EMPLOYEE_ID"; exit 1; }
          {
            printf 'NEPTUNE_OPEN_ID=%s\n' "$NEPTUNE_OPEN_ID"
            printf 'NEPTUNE_AREA_ID=%s\n' "$NEPTUNE_AREA_ID"
            printf 'NEPTUNE_EMPLOYEE_ID=%s\n' "$NEPTUNE_EMPLOYEE_ID"
          } > .env

      - name: Run auto charge script
        run: |
          python main.py
